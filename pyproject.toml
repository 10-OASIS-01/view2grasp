[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "view2grasp"
version = "0.1.0"
description = "Observation-only multimodal grounding for grasping and mobile robotics"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "robosuite==1.5.2", "mujoco==3.3.7", "numpy>=1.26,<2",
  "scipy>=1.12,<1.16", "pillow>=10", "httpx>=0.27", "pydantic>=2",
  "typer>=0.12", "imageio>=2.34", "imageio-ffmpeg==0.6.0", "pyyaml>=6", "h5py>=3.10", "threadpoolctl>=3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
perception = ["sam-2", "torch==2.7.1", "torchvision==0.22.1"]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[project.scripts]
view2grasp = "view2grasp.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/view2grasp"]
