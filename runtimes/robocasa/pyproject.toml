[project]
name = "view2grasp-robocasa-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "robocasa", "robosuite", "httpx>=0.27", "pydantic>=2", "typer>=0.12",
  "imageio-ffmpeg==0.6.0", "threadpoolctl>=3", "pytest>=8",
]

[tool.uv.sources]
robocasa = { path = "vendor/robocasa", editable = true }
robosuite = { path = "vendor/robosuite", editable = true }
